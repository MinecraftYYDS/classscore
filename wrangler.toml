name = "classscore"
main = "src/worker/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源:Vite 构建产物由 Worker 托管(单 Worker 部署,免费额度友好)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "classscore"
# 部署前请替换为你自己的 database_id(CI 会自动创建并写入):
#   npx wrangler d1 create classscore
database_id = "REPLACE_WITH_YOUR_D1_ID"

# 注意:生产环境的 JWT_SECRET 请使用 `npx wrangler secret put JWT_SECRET` 设置,
# 不要写在此处(CI 首次部署会自动生成)。本地开发放在 .dev.vars。
